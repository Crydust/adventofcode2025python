[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "adventofcode2025python"
version = "0.0.1"
dependencies = []
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
authors = [
  {name = "Kristof Neirynck"},
]
description = "Advent of code 2025 in Python"
license = "MIT"
license-files = ["LICENSE.txt"]

[dependency-groups]
dev = [
  "pytest==9.0.2",
  "pytest-cov==7.0.0",
  "ruff==0.15.7",
  "build==1.4.0",
]

[project.urls]
Homepage = "https://github.com/Crydust/adventofcode2025python"
Issues = "https://github.com/Crydust/adventofcode2025python/issues"

[tool.pytest.ini_options]
pythonpath = "src"
